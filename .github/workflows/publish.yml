name: Build and publish Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo run --release --locked -p mincon-ip --example run_testset
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          command: build
          manylinux: '2014'
          args: --release --locked -m crates/mincon-py/Cargo.toml --out dist
      - run: python -m pip install pytest numpy twine
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
      - run: python -m pytest crates/mincon-py/tests -q -p no:cacheprovider
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.15,<2' pytest numpy twine
      - run: maturin sdist -m crates/mincon-py/Cargo.toml --out dist
      - run: python -m twine check --strict dist/*
      - name: Build and test from the source distribution
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python -m pip install --no-deps rebuilt/*.whl
          python -m pytest crates/mincon-py/tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
