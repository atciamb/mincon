name: Build and publish Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested distributions to PyPI
        type: boolean
        default: false
  # A rehearsal whenever this file changes: every build and test leg runs, and
  # the publish job is skipped, because `inputs.publish` is empty on a push.
  # Uploading stays a manual dispatch with publish=true.
  push:
    branches: [master]
    paths: ['.github/workflows/publish.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      # The fixture examples exit 1 on any fixture miss, and the
      # interior-point member alone stands at 55/56, so the verdict is the
      # same one ci.yml uses: no false report of success, and the ratchet.
      - name: Regression test set
        shell: bash
        run: |
          out=$(cargo run --release --locked -p mincon-ip --example run_testset || true)
          echo "$out"
          if echo "$out" | grep -qE "[1-9][0-9]* LIES"; then
            echo "::error::the solver reported success on a problem with no solution"
            exit 1
          fi
          pass=$(echo "$out" | tail -1 | sed -E 's#^([0-9]+)/([0-9]+).*#\1#')
          if [ "$pass" -lt 54 ]; then
            echo "::error::regression: $pass fixtures, expected at least 54"
            exit 1
          fi
      - name: Regression test set, portfolio
        shell: bash
        run: |
          out=$(cargo run --release --locked -p mincon --example run_testset_portfolio -- auto || true)
          echo "$out"
          if echo "$out" | grep -qE "[1-9][0-9]* LIES"; then
            echo "::error::the portfolio reported success on a problem with no solution"
            exit 1
          fi
          pass=$(echo "$out" | tail -1 | sed -E 's#^([0-9]+)/([0-9]+).*#\1#')
          if [ "$pass" -lt 54 ]; then
            echo "::error::portfolio regression: $pass fixtures, expected at least 54"
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # One wheel for Apple silicon and Intel; the tests run on the
          # runner's own architecture.
          - os: macos-latest
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          command: build
          manylinux: '2014'
          target: ${{ matrix.target }}
          args: --release --locked -m crates/mincon-py/Cargo.toml --out dist
      - run: python -m pip install pytest numpy twine
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')])"
      - run: python -m pytest crates/mincon-py/tests -q -p no:cacheprovider
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.15,<2' pytest numpy twine
      - run: maturin sdist -m crates/mincon-py/Cargo.toml --out dist
      - run: python -m twine check --strict dist/*
      - name: Build and test from the source distribution
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python -m pip install --no-deps rebuilt/*.whl
          python -m pytest crates/mincon-py/tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
