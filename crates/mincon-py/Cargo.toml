[package]
name = "mincon-py"
description = "Python bindings for the mincon nonlinear optimizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "pyproject.toml", "README.md", "LICENSE-*", "src/**", "python/**", "tests/**"]

[lib]
name = "_mincon"
crate-type = ["cdylib", "rlib"]
# An extension module does not link libpython (pyo3's `extension-module`
# feature), so a test harness for this crate cannot link on macOS, where the
# linker pulls the interpreter symbols in; on Linux and Windows the unused
# archive members are simply dropped. The crate carries no Rust tests or
# doctests: its tests are `tests/*.py`, run against the built wheel in CI.
test = false
doctest = false

[dependencies]
mincon = { path = "../mincon", version = "0.2.0" }
mincon-core.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"

[lints]
workspace = true
