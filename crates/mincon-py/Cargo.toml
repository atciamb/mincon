[package]
name = "mincon-py"
description = "Python bindings for the mincon nonlinear optimizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
include = ["Cargo.toml", "pyproject.toml", "README.md", "LICENSE-*", "src/**", "python/**", "tests/**"]

[lib]
name = "_mincon"
crate-type = ["cdylib", "rlib"]

[dependencies]
mincon = { path = "../mincon", version = "0.1.0" }
mincon-core.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"

[lints]
workspace = true
