[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "mincon"
description = "Experimental nonlinear constrained optimization in Rust with simple Python and MATLAB-style interfaces"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
keywords = ["optimization", "nonlinear", "constrained", "nlp", "fmincon", "interior-point"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/atciamb/mincon"
Issues = "https://github.com/atciamb/mincon/issues"

[project.optional-dependencies]
bench = ["scipy>=1.10", "matplotlib>=3.6", "pandas>=2.0"]
dev = ["pytest>=7", "maturin>=1.15,<2", "twine>=6"]

[tool.maturin]
# Mixed layout: the compiled extension is `mincon._mincon`, and `python/mincon`
# holds the user-facing wrapper. Keeping the friendly API in Python means the
# result object, the docstrings and the error messages can be improved without
# a recompile, and it is where the SciPy-compatibility shims live.
python-source = "python"
module-name = "mincon._mincon"
features = ["pyo3/extension-module"]

# abi3-py39: one wheel per platform covers every CPython from 3.9 up, instead of
# one per (platform, minor version). That is the difference between 5 wheels and
# 35 on every release, and it is why the pyo3 dependency pins the abi3-py39
# feature. The cost is that a few newer CPython APIs are unavailable, none of
# which this extension needs.
