[workspace]
resolver = "2"
members = [
    "crates/mincon-core",
    "crates/mincon-linalg",
    "crates/mincon-diff",
    "crates/mincon-ip",
    "crates/mincon-testset",
    "crates/mincon-sqp",
    "crates/mincon-qp",
    "crates/mincon",
    "crates/mincon-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
authors = ["mincon contributors"]

[workspace.dependencies]
mincon-core = { path = "crates/mincon-core", version = "0.1.0" }
mincon-linalg = { path = "crates/mincon-linalg", version = "0.1.0" }
mincon-diff = { path = "crates/mincon-diff", version = "0.1.0" }
mincon-ip = { path = "crates/mincon-ip", version = "0.1.0" }
mincon-sqp = { path = "crates/mincon-sqp", version = "0.1.0" }
mincon-qp = { path = "crates/mincon-qp", version = "0.1.0" }
mincon-testset = { path = "crates/mincon-testset", version = "0.1.0" }

thiserror = "2"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# Benchmarks must be run with a profile that keeps debug symbols so that
# `perf`/`samply` traces are attributable. Never benchmark the dev profile.
[profile.bench-prof]
inherits = "release"
debug = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Numerical kernels index several parallel arrays with one index: `col_ptr`,
# `row_idx` and `values` together, or `x`, `v_l` and `v_u` together. Clippy's
# suggested iterator rewrite can only absorb one of them and forces the rest
# back to explicit indexing, which is strictly harder to read and easier to get
# wrong. Every serious Rust numerics crate allows this lint for the same reason.
needless_range_loop = "allow"
